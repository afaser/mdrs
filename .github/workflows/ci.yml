name: CI

on:
  push:
    branches:
      - trunk
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Reject path inputs
        run: jq -e '[.. | objects | select(.type? == "path")] | length == 0' flake.lock

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build default package
        run: nix build .#default --print-build-logs

      - name: Verify runtime libraries
        run: |
          rpath="$(readelf -d result/bin/mdrs | grep RUNPATH)"
          grep -q vulkan-loader <<<"$rpath"
          grep -q wayland <<<"$rpath"
